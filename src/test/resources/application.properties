# Os testes usam a sua propria base (export_tracking_test), no mesmo
# Postgres da base de desenvolvimento. Assim "mvn test" nao enche a lista
# de pedidos com E2E-... nem apaga o contador de pedido_sequencia.
#
# So a URL muda: host, utilizador, palavra-passe, Flyway e JPA continuam
# a vir do application.yml de src/main. Este ficheiro e .properties de
# proposito: o Spring Boot le o application.yml e este ficheiro, e quando
# a mesma chave aparece nos dois ganha o .properties. Um application.yml
# aqui esconderia o de src/main por inteiro. Fica no classpath de teste,
# por isso vale tambem para testes lancados do IDE, sem passar pelo Maven.
#
# A base cria-se uma vez: ver "Banco de dados" no README.
spring.datasource.url=jdbc:postgresql://localhost:5432/export_tracking_test
