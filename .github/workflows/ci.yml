name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Os testes ligam a export_tracking_test (src/test/resources/
          # application.properties), por isso e esta a base que o servico cria.
          POSTGRES_DB: export_tracking_test
          POSTGRES_USER: export_tracking
          POSTGRES_PASSWORD: export_tracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Rodar suite completa (unitario + API + E2E)
        id: tests
        run: mvn --batch-mode --no-transfer-progress test

      # AI Test Triage (docs/ai-test-triage). Corre SO se os testes falharam e nunca muda o
      # resultado do job: o passo acima continua a ser a unica causa da falha, e estes dois
      # passos tem continue-on-error. A chave do Claude so existe no segundo passo (o primeiro
      # corre plugins Maven e nao precisa dela). Sem chave, o triage mostra TRIAGE FAILED.
      - name: AI Test Triage - preparar classpath
        if: failure() && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: mvn --batch-mode --quiet dependency:build-classpath -Dmdep.outputFile=target/triage.classpath

      - name: AI Test Triage - diagnostico
        if: failure() && steps.tests.outcome == 'failure'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -s target/triage.classpath ]; then
            java -cp "target/classes:$(cat target/triage.classpath)" com.eversonrubira.exporttracking.triage.TriageApplication
          else
            echo "| TRIAGE FAILED: could not resolve the triage classpath. The original test failure is unchanged."
          fi

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Rodar testes (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build (tsc + vite build)
        working-directory: frontend
        run: npm run build
