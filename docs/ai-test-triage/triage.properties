# Configuracao do AI Test Triage V1. Estes sao os valores por omissao: apagar
# uma linha tem o mesmo efeito que deixar o valor aqui. Qualquer chave pode ser
# sobreposta com -Dtriage.<chave>=valor (propriedade de sistema).
# Caminhos relativos contam a partir de triage.project-root.

# Liga/desliga o triage. Com false, o ponto de entrada so escreve uma linha.
triage.enabled=true

# Raiz do projeto e relatorios dos testes (Surefire).
triage.project-root=.
triage.reports-dir=target/surefire-reports

# Claude (T07). O modelo e configuravel; sem tool use, a resposta e JSON em texto.
triage.provider.model=claude-sonnet-5-5
# ADR-003: 30 s por tentativa, no maximo 2 tentativas (2 e o teto, nao se aceita mais).
triage.provider.timeout-seconds=30
triage.provider.max-attempts=2

# ADR-004: no maximo 5 testes falhados distintos por pipeline (5 e o teto).
# Pior caso sequencial de espera: 5 falhas x 2 tentativas x 30 s = cerca de 5 minutos.
# Sem timeout global na V1; o T12 fornece os dados para rever esta decisao.
triage.max-failures=5

# Recolha do log e do stack trace.
triage.collector.max-log-lines=100
triage.context.max-stack-lines=80

# Recuperacao deterministica de contexto (ADR-001).
# Raizes de codigo, por ordem de procura, e pacotes que contam como "do projeto".
triage.source-roots=src/test/java,src/main/java
triage.project-packages=com.eversonrubira.exporttracking
# Mapeamento explicito classe/pacote -> specs/ADRs (ver o proprio ficheiro).
triage.doc-map=docs/ai-test-triage/doc-map.properties

# Limites de contexto (RNF-05): caracteres por artefacto, linhas de cada lado da
# linha citada no stack trace, ficheiros de codigo, documentos e total.
triage.context.max-chars-per-artifact=8000
triage.context.region-radius-lines=30
triage.context.max-source-files=6
triage.context.max-documents=3
triage.context.max-total-chars=40000
